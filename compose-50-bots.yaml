services:
  bot-1:
    build: ./
    platform: linux/amd64
    container_name: zoom-bot-1
    volumes:
    - .:/tmp/meeting-sdk-linux-sample
    - build-cache:/tmp/meeting-sdk-linux-sample/build
    environment:
    - DISPLAY_NAME=Sufyan
    - JOIN_URL=https://us06web.zoom.us/j/5067498331?pwd=4aJ3z9zb8f0ZaKiouEYdWNFhBh1V6d.1&omn=81101816351
    - QT_LOGGING_RULES=*.debug=false;*.warning=false;*.info=false;*.critical=false
    - QT_QPA_PLATFORM=offscreen
    - G_MESSAGES_DEBUG=
    entrypoint:
    - /tini
    - --
    - ./bin/entry-bot-optimized.sh
    command:
    - --join-url
    - https://us06web.zoom.us/j/5067498331?pwd=4aJ3z9zb8f0ZaKiouEYdWNFhBh1V6d.1&omn=81101816351
    - --display-name
    - Sufyan
    - --config
    - config.toml
    - "--zak"
    - "eyJ0eXAiOiJKV1QiLCJzdiI6IjAwMDAwMiIsInptX3NrbSI6InptX28ybSIsImFsZyI6IkhTMjU2In0.eyJhdWQiOiJjbGllbnRzbSIsInVpZCI6Ikl2RVAxQ05UU0w2UWxaVldnbkhuVVEiLCJ6aWQiOiI0YjJjMDE4NGQ2N2Q0NjY4YmQ3OTYzMzUzYTM4NTJmOCIsImlzcyI6IndlYiIsInNrIjoiMCIsInN0eSI6MSwid2NkIjoidXMwNiIsImNsdCI6MCwiZXhwIjoxNzYzNzgyMDc4LCJpYXQiOjE3NjM3NzQ4NzgsImFpZCI6ImtPanJYZWRCUndHbGJHaUN5elFPeVEiLCJjaWQiOiIifQ.nFG7zx3NMOPVaeYmmfq0dJS76c5ujoqgIdRci-X_CG8"
    - RawVideo
    - --input
    - videos/video-1.mp4
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 128M
    stop_grace_period: 2s
    restart: 'no'
