      - "https://us05web.zoom.us/j/5067498331?pwd=4aJ3z9zb8f0ZaKiouEYdWNFhBh1V6d.1&omn=86931044022"
      - "--display-name"
      - "Bot-1-Alice"
      - "--config"
      - "config.toml"
      - "--zak"
      - "eyJ0eXAiOiJKV1QiLCJzdiI6IjAwMDAwMiIsInptX3NrbSI6InptX28ybSIsImFsZyI6IkhTMjU2In0.eyJhdWQiOiJjbGllbnRzbSIsInVpZCI6Ikl2RVAxQ05UU0w2UWxaVldnbkhuVVEiLCJ6aWQiOiI2ZWNiZmE5MWNlMDE0ZTQ4YjBlOTk2Y2Y2YThkMjU2OCIsImlzcyI6IndlYiIsInNrIjoiMCIsInN0eSI6MSwid2NkIjoidXMwNiIsImNsdCI6MCwiZXhwIjoxNzYzNTE3NzI4LCJpYXQiOjE3NjM1MTA1MjgsImFpZCI6ImtPanJYZWRCUndHbGJHaUN5elFPeVEiLCJjaWQiOiIifQ.61TgZn6O-_zoyPYOpVeaaxn-AFInJOA5d34lm3LjoVc"
      - "RawVideo"
      - "--input"
      - "videos/video-1.mp4"
      - "RawAudio"
      - "--file"
      - "dev-null.pcm"
      - "--dir"
      - "/dev"
    deploy:
      resources:
        limits:
          cpus: '0.3'      # Optimized for 50 bots: actual usage ~0.25, limit allows burst
          memory: 256M     # Optimized: was 2G, actual usage ~153MB
        reservations:
          cpus: '0.05'     # Minimal reservation for 50 bots
          memory: 128M     # Optimized: was 512M
    stop_grace_period: 2s  # Quick shutdown - leave meeting immediately
    restart: "no"

