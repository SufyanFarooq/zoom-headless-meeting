services:
  bot-9999999999-1:
    image: zoom-bot:latest
    container_name: zoom-bot-9999999999-1
    volumes:
    - /opt/zoom-bot-dashboard:/tmp/meeting-sdk-linux-sample
    - build-cache:/tmp/meeting-sdk-linux-sample/build
    environment:
    - DISPLAY_NAME=Arjun
    - JOIN_URL=https://zoom.us/j/9999999999?pwd=123456
    - QT_LOGGING_RULES=*.debug=false;*.warning=false;*.info=false;*.critical=false
    - QT_QPA_PLATFORM=offscreen
    - G_MESSAGES_DEBUG=
    working_dir: /tmp/meeting-sdk-linux-sample
    entrypoint:
    - /tini
    - --
    - ./bin/entry-bot-optimized.sh
    command:
    - --join-url
    - https://zoom.us/j/9999999999?pwd=123456
    - --display-name
    - Arjun
    - --config
    - config.toml
    - RawAudio
    - --file
    - dev-null.pcm
    - --dir
    - "/dev"
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 192M
        reservations:
          cpus: '0.03'
          memory: 96M
    stop_grace_period: 2s
    restart: 'no'
