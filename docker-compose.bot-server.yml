version: '3.8'

services:
  # Bot Server API
  bot-server:
    build:
      context: .
      dockerfile: Dockerfile.bot-server
    container_name: zoom-bot-server-api
    environment:
      BOT_SERVER_PORT: 3001
      SERVER_CAPACITY: ${SERVER_CAPACITY:-100}
      BOT_PROJECT_DIR: /app/bot-project
      ZOOM_AUTH_RETRIES: ${ZOOM_AUTH_RETRIES:-2}
      BOT_PREBUILT_RUNTIME: ${BOT_PREBUILT_RUNTIME:-true}
      BOT_WARM_POOL_SIZE: ${BOT_WARM_POOL_SIZE:-0}
      BOT_WARM_POOL_AUTO_REFILL_ON_CREATE: ${BOT_WARM_POOL_AUTO_REFILL_ON_CREATE:-false}
      BOT_WARM_POOL_DIRECT_ASSIGN: ${BOT_WARM_POOL_DIRECT_ASSIGN:-true}
      BOT_WARM_POOL_PREFIX: ${BOT_WARM_POOL_PREFIX:-zoom-warm-bot}
      BOT_WARM_POOL_IMAGE: ${BOT_WARM_POOL_IMAGE:-zoom-bot:latest}
      BOT_WARM_POOL_CPU: ${BOT_WARM_POOL_CPU:-0.05}
      BOT_WARM_POOL_MEM: ${BOT_WARM_POOL_MEM:-256m}
      BOT_WARM_POOL_MEM_RESERVATION: ${BOT_WARM_POOL_MEM_RESERVATION:-128m}
    ports:
      - "${BOT_SERVER_PORT:-3001}:3001"
    volumes:
      - .:/app/bot-project
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - zoom-network
    restart: unless-stopped

networks:
  zoom-network:
    driver: bridge
