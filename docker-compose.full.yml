
# Full stack: Dashboard + Database + Bot Server
# Use this for single-server deployment

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: zoom-dashboard-db
    environment:
      POSTGRES_DB: ${DB_NAME:-zoom_bots}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zoom-network

  # Dashboard API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: zoom-dashboard-api
    environment:
      DB_HOST: postgres
      BOT_SERVER_URL: ${BOT_SERVER_URL:-http://bot-server:3001}
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-zoom_bots}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      PORT: 3000
      ZOOM_ACCOUNT_ID: ${ZOOM_ACCOUNT_ID}
      ZOOM_CLIENT_ID: ${ZOOM_CLIENT_ID}
      ZOOM_CLIENT_SECRET: ${ZOOM_CLIENT_SECRET}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./profile-pics:/app/profile-pics
    networks:
      - zoom-network
    restart: unless-stopped

  # Dashboard UI (Nginx)
  dashboard:
    image: nginx:alpine
    container_name: zoom-dashboard-ui
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${DASHBOARD_PORT:-8080}:80"
    depends_on:
      - api
    networks:
      - zoom-network
    restart: unless-stopped

  # Bot image (build only - used by dynamically created bot containers)
  # Run: docker compose -f docker-compose.full.yml build zoom-bot
  zoom-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: zoom-bot:latest
    volumes:
      - .:/app/bot-project
      - ./config.toml:/tmp/meeting-sdk-linux-sample/config.toml:rw
    profiles:
      - build  # Only build when explicitly requested: docker compose --profile build build zoom-bot

  # Bot Server API (optional - for single server)
  bot-server:
    build:
      context: .
      dockerfile: Dockerfile.bot-server
    container_name: zoom-bot-server-api
    env_file: .env
    environment:
      BOT_SERVER_PORT: 3001
      SERVER_CAPACITY: ${SERVER_CAPACITY:-100}
      BOT_PROJECT_DIR: /app/bot-project
      HOST_PROJECT_PATH: "${HOST_PROJECT_PATH:-/opt/zoom-headless-meeting}"
      ZOOM_ACCOUNT_ID: ${ZOOM_ACCOUNT_ID}
      ZOOM_CLIENT_ID: ${ZOOM_CLIENT_ID}
      ZOOM_CLIENT_SECRET: ${ZOOM_CLIENT_SECRET}
      ZOOM_REFRESH_TOKEN: ${ZOOM_REFRESH_TOKEN:-}
      ZOOM_BOT_EMAIL: ${ZOOM_BOT_EMAIL:-}
      ZOOM_OAUTH_CLIENT_ID: ${ZOOM_OAUTH_CLIENT_ID:-}
      ZOOM_OAUTH_CLIENT_SECRET: ${ZOOM_OAUTH_CLIENT_SECRET:-}
      ZAK_USE_REFRESH_ONLY: ${ZAK_USE_REFRESH_ONLY:-}
      ZAK_REFRESH_INTERVAL_MINUTES: ${ZAK_REFRESH_INTERVAL_MINUTES:-120}
      BOT_CREATE_ASYNC: ${BOT_CREATE_ASYNC:-true}
      BOT_STOP_ASYNC: ${BOT_STOP_ASYNC:-true}
      BOT_START_STAGGER_MS: ${BOT_START_STAGGER_MS:-300}
      ZOOM_AUTH_RETRIES: ${ZOOM_AUTH_RETRIES:-2}
      BOT_PREBUILT_RUNTIME: ${BOT_PREBUILT_RUNTIME:-true}
      BOT_WARM_POOL_SIZE: ${BOT_WARM_POOL_SIZE:-0}
      BOT_WARM_POOL_AUTO_REFILL_ON_CREATE: ${BOT_WARM_POOL_AUTO_REFILL_ON_CREATE:-false}
      BOT_WARM_POOL_DIRECT_ASSIGN: ${BOT_WARM_POOL_DIRECT_ASSIGN:-true}
      BOT_WARM_POOL_STRICT_RECONCILE: ${BOT_WARM_POOL_STRICT_RECONCILE:-false}
      BOT_WARM_POOL_PREFIX: ${BOT_WARM_POOL_PREFIX:-zoom-warm-bot}
      BOT_WARM_POOL_IMAGE: ${BOT_WARM_POOL_IMAGE:-zoom-bot:latest}
      BOT_WARM_POOL_CPU: ${BOT_WARM_POOL_CPU:-0.05}
      BOT_WARM_POOL_MEM: ${BOT_WARM_POOL_MEM:-256m}
      BOT_WARM_POOL_MEM_RESERVATION: ${BOT_WARM_POOL_MEM_RESERVATION:-128m}
      VIDEO_CPU_LIMIT: ${VIDEO_CPU_LIMIT-0.3}
      AUDIO_CPU_LIMIT: ${AUDIO_CPU_LIMIT-0.1}
      VIDEO_MEM_LIMIT: ${VIDEO_MEM_LIMIT-512M}
      AUDIO_MEM_LIMIT: ${AUDIO_MEM_LIMIT-256M}
      VIDEO_CPU_RESERVATION: ${VIDEO_CPU_RESERVATION-0.05}
      AUDIO_CPU_RESERVATION: ${AUDIO_CPU_RESERVATION-0.02}
      VIDEO_MEM_RESERVATION: ${VIDEO_MEM_RESERVATION-256M}
      AUDIO_MEM_RESERVATION: ${AUDIO_MEM_RESERVATION-128M}
      AUDIO_USE_CAMERA: ${AUDIO_USE_CAMERA:-true}
      AUDIO_DIRECT_OFF_JOIN: ${AUDIO_DIRECT_OFF_JOIN:-false}
      BOT_POST_JOIN_THROTTLE_ENABLED: ${BOT_POST_JOIN_THROTTLE_ENABLED:-false}
      BOT_POST_JOIN_THROTTLE_CPU: ${BOT_POST_JOIN_THROTTLE_CPU-}
      BOT_POST_JOIN_THROTTLE_MEMORY: ${BOT_POST_JOIN_THROTTLE_MEMORY-}
      BOT_POST_JOIN_THROTTLE_MEMORY_RESERVATION: ${BOT_POST_JOIN_THROTTLE_MEMORY_RESERVATION-}
      BOT_POST_JOIN_THROTTLE_INITIAL_DELAY_MS: ${BOT_POST_JOIN_THROTTLE_INITIAL_DELAY_MS:-15000}
      BOT_POST_JOIN_THROTTLE_POLL_MS: ${BOT_POST_JOIN_THROTTLE_POLL_MS:-5000}
      BOT_POST_JOIN_THROTTLE_CONNECTED_GRACE_MS: ${BOT_POST_JOIN_THROTTLE_CONNECTED_GRACE_MS:-10000}
      BOT_POST_JOIN_THROTTLE_MAX_WAIT_MS: ${BOT_POST_JOIN_THROTTLE_MAX_WAIT_MS:-180000}
      BOT_START_WINDOW_ENABLED: ${BOT_START_WINDOW_ENABLED:-true}
      BOT_START_MAX_IN_FLIGHT: ${BOT_START_MAX_IN_FLIGHT:-16}
      BOT_START_MAX_CPU_PERCENT: ${BOT_START_MAX_CPU_PERCENT:-75}
      BOT_START_POLL_MS: ${BOT_START_POLL_MS:-1000}
      CAPACITY_TARGET_CPU_PERCENT: ${CAPACITY_TARGET_CPU_PERCENT:-85}
      CAPACITY_CPU_PER_BOT: ${CAPACITY_CPU_PER_BOT:-0.1}
    ports:
      - "${BOT_SERVER_PORT:-3001}:3001"
    volumes:
      - .:/app/bot-project
      - ./bot-server:/app/bot-server
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - zoom-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  zoom-network:
    driver: bridge
