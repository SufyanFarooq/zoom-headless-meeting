<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Zoom Services Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }
        .login-box {
            background: #2a2a2a;
            padding: 32px;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 380px;
            border: 1px solid #3a3a3a;
        }
        .login-box h1 {
            text-align: center;
            margin-bottom: 24px;
            color: #4a9eff;
            font-size: 22px;
            font-weight: 600;
        }
        .login-form .form-group { margin-bottom: 18px; }
        .login-form label {
            display: block;
            margin-bottom: 6px;
            color: #888;
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .login-form input {
            width: 100%;
            min-height: 42px;
            padding: 10px 12px;
            border: 1px solid #3a3a3a;
            border-radius: 6px;
            font-size: 14px;
            background: #1a1a1a;
            color: #fff;
            box-sizing: border-box;
        }
        .login-form input:focus {
            outline: none;
            border-color: #4a9eff;
        }
        .login-form input::placeholder { color: #666; }
        .login-form button {
            width: 100%;
            min-height: 42px;
            padding: 10px;
            background: #4a9eff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }
        .login-form button:hover { background: #3a8eef; }
        .login-form button:disabled { background: #3a3a3a; cursor: not-allowed; }
        .error-message {
            background: rgba(255,68,68,0.15);
            color: #ff6b6b;
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 18px;
            font-size: 13px;
            display: none;
        }
        .error-message.show { display: block; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>ZOOM SERVICES</h1>
            <div class="error-message" id="errorMessage"></div>
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="username">Username or Email</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" id="loginButton">LOGIN</button>
            </form>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
