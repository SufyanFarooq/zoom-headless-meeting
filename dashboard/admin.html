<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Zoom Services</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .badge { font-size: 11px; padding: 4px 10px; border-radius: 4px; font-weight: 500; }
        .badge-admin { background: #6f42c1; color: white; }
        .badge-user { background: #3a3a3a; color: #aaa; }
        .btn-link { display: inline-block; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 500; text-decoration: none; transition: all 0.2s; margin-right: 6px; border: none; cursor: pointer; }
        .btn-monitor { background: #4a9eff; color: white; }
        .btn-monitor:hover { background: #3a8eef; }
        .btn-report { background: #28a745; color: white; }
        .btn-report:hover { background: #218838; }
        .btn-password { background: #ff9f1a; color: white; }
        .btn-password:hover { background: #e38c12; }
        .btn-block { background: #dc3545; color: white; }
        .btn-block:hover { background: #c82333; }
        .btn-unblock { background: #17a2b8; color: white; }
        .btn-unblock:hover { background: #138496; }
        .btn-limit { background: #6c757d; color: white; }
        .btn-limit:hover { background: #5a6268; }
        .form-actions { margin-top: 12px; }
        .table-container { overflow: visible; }
        .table-scroll { overflow-x: auto; }
        .actions-menu { position: relative; display: inline-block; }
        .btn-more { background: #3a3a3a; color: #fff; padding: 6px 10px; border-radius: 6px; }
        .btn-more:hover { background: #4a4a4a; }
        .menu-dropdown { position: fixed; left: 0; top: 0; min-width: 160px; max-width: calc(100vw - 16px); background: #222; border: 1px solid #3a3a3a; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.35); padding: 6px; display: none; z-index: 999; }
        .menu-dropdown.show { display: block; }
        .menu-item { display: block; width: 100%; text-align: left; padding: 8px 10px; border-radius: 6px; background: transparent; border: none; color: #e6e6e6; text-decoration: none; cursor: pointer; font-size: 13px; }
        .menu-item:hover { background: #2f2f2f; }
        .menu-item.is-disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); display: none; align-items: center; justify-content: center; z-index: 1200; padding: 16px; }
        .modal-overlay.show { display: flex; }
        .admin-modal { width: 100%; max-width: 460px; background: #222; border: 1px solid #3a3a3a; border-radius: 10px; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35); }
        .admin-modal-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid #3a3a3a; }
        .admin-modal-title { margin: 0; font-size: 16px; color: #fff; }
        .admin-modal-close { background: transparent; border: none; color: #aaa; font-size: 22px; line-height: 1; cursor: pointer; padding: 0; }
        .admin-modal-close:hover { color: #fff; }
        .admin-modal-body { padding: 16px; }
        .admin-modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }
    </style>
</head>
<body>
    <div class="page-layout">
        <p class="page-breadcrumb"><a href="index.html">Dashboard</a> / Admin</p>
        <div class="page-header">
            <div>
                <h1>Admin Panel</h1>
                <p class="subtitle">Manage accounts, monitor users, and view reports</p>
            </div>
            <div class="form-row">
                <a href="admin-cost.html" class="btn-nav">Cost Settings</a>
                <a href="index.html" class="btn-nav">← Dashboard</a>
            </div>
        </div>

        <section class="page-section">
            <h2>Create New Account</h2>
            <div class="form-grid-2">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="newUsername" placeholder="Username">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="newEmail" placeholder="Email">
                </div>
            </div>
            <div class="form-grid-2">
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="newPassword" placeholder="Min 6 characters">
                </div>
                <div class="form-group">
                    <label>Max Members Limit</label>
                    <input type="number" id="newMaxLimit" min="1" placeholder="e.g. 100">
                </div>
            </div>
            <div class="form-actions">
                <button class="btn-primary" onclick="createAccount()">Create Account</button>
            </div>
        </section>

        <section class="page-section">
            <h2>All Accounts</h2>
            <div class="table-container">
                <div class="table-scroll">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Username</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Active</th>
                                <th>Total Bots</th>
                                <th>Limit</th>
                                <th>Blocked</th>
                                <th>Created</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <tr><td colspan="10" class="no-data">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>

    <script>
        const API_BASE = window.location.hostname === 'localhost' && window.location.port === '8080' ? 'http://localhost:3000/api' : '/api';

        function getAuthHeaders() {
            const token = localStorage.getItem('authToken');
            return { 'Content-Type': 'application/json', ...(token && { 'Authorization': `Bearer ${token}` }) };
        }

        async function checkAdmin() {
            const token = localStorage.getItem('authToken');
            if (!token) { window.location.href = 'login.html'; return false; }
            try {
                const res = await fetch(`${API_BASE}/auth/me`, { headers: getAuthHeaders() });
                const data = await res.json();
                if (!res.ok || !data.user?.is_admin) {
                    alert('Admin access required');
                    window.location.href = 'index.html';
                    return false;
                }
                return true;
            } catch (e) {
                window.location.href = 'login.html';
                return false;
            }
        }

        async function loadUsers() {
            try {
                const res = await fetch(`${API_BASE}/admin/users`, { headers: getAuthHeaders() });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed to load users');
                renderUsers(data.users);
            } catch (e) {
                document.getElementById('usersTableBody').innerHTML = `<tr><td colspan="8" class="no-data">Error: ${e.message}</td></tr>`;
            }
        }

        function escapeHtml(s) {
            if (!s) return '';
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML.replace(/"/g, '&quot;');
        }

        function renderUsers(users) {
            const tbody = document.getElementById('usersTableBody');
            if (!users || users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" class="no-data">No accounts yet</td></tr>';
                return;
            }
            tbody.innerHTML = users.map((u, i) => {
                const name = encodeURIComponent(u.username || '');
                const limitText = u.max_members_limit ? u.max_members_limit : '—';
                const blocked = !!u.is_blocked;
                const blockDisabled = !!u.is_admin;
                const blockLabel = blocked ? 'Unblock' : 'Block';
                const blockClass = blocked ? 'btn-unblock' : 'btn-block';
                const blockClick = blockDisabled ? '' : `toggleBlock(${u.id}, ${blocked})`;
                return `
                <tr>
                    <td>${i + 1}</td>
                    <td><strong>${escapeHtml(u.username)}</strong></td>
                    <td>${escapeHtml(u.email)}</td>
                    <td><span class="badge ${u.is_admin ? 'badge-admin' : 'badge-user'}">${u.is_admin ? 'Admin' : 'User'}</span></td>
                    <td>${u.active_meetings || 0}</td>
                    <td>${u.total_bots_submitted || 0}</td>
                    <td>${limitText}</td>
                    <td>${blocked ? 'Yes' : 'No'}</td>
                    <td>${u.created_at ? new Date(u.created_at).toLocaleDateString() : '—'}</td>
                    <td>
                        <div class="actions-menu">
                            <button
                                class="btn-link btn-more"
                                title="Actions"
                                data-user-id="${u.id}"
                                data-username="${escapeHtml(u.username || '')}"
                                data-email="${escapeHtml(u.email || '')}"
                                data-max-limit="${u.max_members_limit || ''}"
                                data-blocked="${blocked ? 'true' : 'false'}"
                                data-is-admin="${u.is_admin ? 'true' : 'false'}"
                                onclick="openActionsMenu(event, this)"
                            >⋮</button>
                        </div>
                    </td>
                </tr>
            `}).join('');
        }

        async function createAccount() {
            const username = document.getElementById('newUsername').value.trim();
            const email = document.getElementById('newEmail').value.trim();
            const password = document.getElementById('newPassword').value;
            const maxLimitRaw = document.getElementById('newMaxLimit').value.trim();
            if (!username || !email || !password) {
                alert('Fill all fields');
                return;
            }
            if (password.length < 6) {
                alert('Password must be at least 6 characters');
                return;
            }
            let maxMembersLimit = null;
            if (maxLimitRaw) {
                const parsed = parseInt(maxLimitRaw, 10);
                if (isNaN(parsed) || parsed <= 0) {
                    alert('Max members limit must be a positive number');
                    return;
                }
                maxMembersLimit = parsed;
            }
            try {
                const res = await fetch(`${API_BASE}/admin/users`, {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ username, email, password, maxMembersLimit })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed');
                alert('Account created! User can now login.');
                document.getElementById('newUsername').value = '';
                document.getElementById('newEmail').value = '';
                document.getElementById('newPassword').value = '';
                document.getElementById('newMaxLimit').value = '';
                loadUsers();
            } catch (e) {
                alert(e.message);
            }
        }

        let activeUpdateUserId = null;

        function openUpdateModal(userId, currentUsername, currentEmail) {
            closeAllMenus();
            activeUpdateUserId = userId;
            document.getElementById('updateUsername').value = currentUsername || '';
            document.getElementById('updateEmail').value = currentEmail || '';
            document.getElementById('updatePassword').value = '';
            document.getElementById('updateUserModal').classList.add('show');
            setTimeout(() => document.getElementById('updateUsername').focus(), 0);
        }

        function closeUpdateModal() {
            document.getElementById('updateUserModal').classList.remove('show');
            document.getElementById('updateUserForm').reset();
            activeUpdateUserId = null;
        }

        async function submitUpdateUserForm(event) {
            event.preventDefault();
            if (!activeUpdateUserId) return;

            const username = document.getElementById('updateUsername').value.trim();
            const email = document.getElementById('updateEmail').value.trim();
            const password = document.getElementById('updatePassword').value.trim();

            if (!username) {
                alert('Username is required');
                return;
            }
            if (!email) {
                alert('Email is required');
                return;
            }
            if (password && password.length < 6) {
                alert('Password must be at least 6 characters');
                return;
            }

            const saveBtn = document.getElementById('updateUserSaveBtn');
            const payload = { username, email };
            if (password) payload.password = password;

            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';

            try {
                const res = await fetch(`${API_BASE}/admin/users/${activeUpdateUserId}`, {
                    method: 'PUT',
                    headers: getAuthHeaders(),
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed');
                closeUpdateModal();
                alert('User details updated');
                loadUsers();
            } catch (e) {
                alert(e.message);
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = 'Save Changes';
            }
        }

        async function toggleBlock(userId, isBlocked) {
            closeAllMenus();
            const action = isBlocked ? 'unblock' : 'block';
            if (!confirm(`Are you sure you want to ${action} this user?`)) return;
            try {
                const res = await fetch(`${API_BASE}/admin/users/${userId}/block`, {
                    method: 'PUT',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ blocked: !isBlocked })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed');
                loadUsers();
            } catch (e) {
                alert(e.message);
            }
        }

        async function updateLimit(userId, currentLimit) {
            closeAllMenus();
            const current = currentLimit && currentLimit !== 'null' ? String(currentLimit) : '';
            const input = prompt('Set max members limit (leave blank to remove):', current);
            if (input === null) return;
            const trimmed = input.trim();
            let maxMembersLimit = null;
            if (trimmed) {
                const parsed = parseInt(trimmed, 10);
                if (isNaN(parsed) || parsed <= 0) {
                    alert('Max members limit must be a positive number');
                    return;
                }
                maxMembersLimit = parsed;
            }
            try {
                const res = await fetch(`${API_BASE}/admin/users/${userId}/limit`, {
                    method: 'PUT',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ maxMembersLimit })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed');
                loadUsers();
            } catch (e) {
                alert(e.message);
            }
        }

        function closeAllMenus() {
            const menu = document.getElementById('actionsMenu');
            if (menu) menu.classList.remove('show');
        }

        function openActionsMenu(event, trigger) {
            event.stopPropagation();
            const menu = document.getElementById('actionsMenu');
            if (!menu) return;
            closeAllMenus();

            const userId = trigger.dataset.userId;
            const usernameRaw = trigger.dataset.username || '';
            const emailRaw = trigger.dataset.email || '';
            const maxLimitRaw = trigger.dataset.maxLimit || '';
            const isBlocked = trigger.dataset.blocked === 'true';
            const isAdmin = trigger.dataset.isAdmin === 'true';

            const monitor = menu.querySelector('[data-action="monitor"]');
            const report = menu.querySelector('[data-action="report"]');
            const updateBtn = menu.querySelector('[data-action="update"]');
            const blockBtn = menu.querySelector('[data-action="block"]');
            const limitBtn = menu.querySelector('[data-action="limit"]');

            const nameParam = encodeURIComponent(usernameRaw);
            monitor.href = `monitor.html?userId=${userId}&name=${nameParam}`;
            report.href = `user-report.html?userId=${userId}&name=${nameParam}`;

            updateBtn.onclick = () => openUpdateModal(parseInt(userId, 10), usernameRaw, emailRaw);
            limitBtn.onclick = () => updateLimit(parseInt(userId, 10), maxLimitRaw || null);

            const blockLabel = isBlocked ? 'Unblock' : 'Block';
            blockBtn.textContent = blockLabel;
            blockBtn.classList.toggle('is-disabled', isAdmin);
            blockBtn.onclick = () => {
                if (isAdmin) return;
                toggleBlock(parseInt(userId, 10), isBlocked);
            };

            menu.classList.add('show');
            menu.style.maxHeight = '';
            menu.style.overflowY = '';
            menu.style.left = '0px';
            menu.style.top = '0px';
            menu.scrollTop = 0;

            const btnRect = trigger.getBoundingClientRect();
            const menuRect = menu.getBoundingClientRect();
            const margin = 8;
            let left = btnRect.right - menuRect.width;
            if (btnRect.left + menuRect.width <= window.innerWidth - margin) {
                left = btnRect.left;
            }
            const maxLeft = window.innerWidth - menuRect.width - margin;
            left = Math.min(Math.max(left, margin), Math.max(margin, maxLeft));
            let top = btnRect.bottom + 6;
            if (top + menuRect.height > window.innerHeight - margin) {
                top = btnRect.top - menuRect.height - 6;
            }
            if (top < margin) {
                top = margin;
                const maxH = window.innerHeight - margin * 2;
                menu.style.maxHeight = `${maxH}px`;
                menu.style.overflowY = 'auto';
            }
            menu.style.left = `${left}px`;
            menu.style.top = `${top}px`;
        }

        document.addEventListener('click', () => closeAllMenus());
        window.addEventListener('resize', () => closeAllMenus());
        window.addEventListener('scroll', () => closeAllMenus(), true);
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') closeUpdateModal();
        });

        document.addEventListener('DOMContentLoaded', async () => {
            if (await checkAdmin()) loadUsers();
        });
    </script>
    <div id="actionsMenu" class="menu-dropdown" onclick="event.stopPropagation()">
        <a href="#" class="menu-item" data-action="monitor">Monitor</a>
        <a href="#" class="menu-item" data-action="report">Report</a>
        <button class="menu-item" type="button" data-action="update">Update</button>
        <button class="menu-item" type="button" data-action="block">Block</button>
        <button class="menu-item" type="button" data-action="limit">Set Limit</button>
    </div>
    <div id="updateUserModal" class="modal-overlay" onclick="if(event.target === this) closeUpdateModal()">
        <div class="admin-modal" role="dialog" aria-modal="true" aria-labelledby="updateUserTitle">
            <div class="admin-modal-header">
                <h3 id="updateUserTitle" class="admin-modal-title">Update User</h3>
                <button type="button" class="admin-modal-close" onclick="closeUpdateModal()" aria-label="Close">×</button>
            </div>
            <form id="updateUserForm" class="admin-modal-body form-stack" onsubmit="submitUpdateUserForm(event)">
                <div class="form-group">
                    <label for="updateUsername">Username</label>
                    <input type="text" id="updateUsername" required>
                </div>
                <div class="form-group">
                    <label for="updateEmail">Email</label>
                    <input type="email" id="updateEmail" required>
                </div>
                <div class="form-group">
                    <label for="updatePassword">Password (optional)</label>
                    <input type="password" id="updatePassword" minlength="6" placeholder="Leave blank to keep current password">
                </div>
                <div class="admin-modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeUpdateModal()">Cancel</button>
                    <button type="submit" class="btn-primary" id="updateUserSaveBtn">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
